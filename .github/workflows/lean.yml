name: Verify the CK Lean formalization

on:
  push:
    branches: [main]
    paths:
      - 'lean/**'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          lint: false
          test: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Build and audit the proof from source
        working-directory: lean
        run: python3 scripts/verify_lean.py --fetch-cache --jobs 1
